<template id="vorlage">
  <div class="handout">
    <div class="kopf"><span>Religion – Referat</span><span>Namen: ______________________</span></div>
    <h1>KI bremsen?</h1>
    <div class="frage">Sollte die Entwicklung immer stärkerer KI gebremst werden?</div>

    <h2>Kontroverse und Aktualität</h2>
    <p class="text">Am 12.09.2026 fordert Anthropic-Chef Dario Amodei, die Entwicklung der stärksten KI-Modelle zu bremsen („We Must Pace the Frontier“). OpenAI, xAI und Microsoft stimmen zu, bringen 10 Tage später aber trotzdem neue Modelle heraus.
    <b>Streitpunkt:</b> Fortschritt und Wettbewerb gegen Sicherheit und Kontrolle. Wenige Firmen entscheiden über ein Risiko, das alle betrifft.</p>

    <h2>Begriffe</h2>
    <dl>
      <dt>Frontier-Modell</dt>
      <dd>eines der stärksten KI-Modelle an der Spitze der Entwicklung</dd>
      <dt>Pacing</dt>
      <dd>das Entwicklungstempo drosseln, ohne ganz zu stoppen</dd>
      <dt>Regulatory Capture</dt>
      <dd>große Firmen beeinflussen Gesetze so, dass sie selbst davon profitieren</dd>
    </dl>

    <h2>Drei Sichtweisen</h2>
    <table>
      <tr><th>Wirtschaft</th><th>Politik (USA)</th><th>Europa</th></tr>
      <tr><td>Bremsen, aber nicht stoppen; externe Prüfer in den Firmen</td><td>Keine Gesetze, Firmen sollen selbst bremsen; China macht eh nicht mit</td><td>Erst aufholen, sonst bleiben USA und China dauerhaft vorne</td></tr>
      <tr><td><i>Werte:</i> Sicherheit, Marktmacht</td><td><i>Werte:</i> Freiheit, Wettbewerb</td><td><i>Werte:</i> Gerechtigkeit, Unabhängigkeit</td></tr>
    </table>

    <h2>Unser Urteil</h2>
    <div class="meinung">
      <b>Bremsen an der Spitze, nicht bei den Aufholern.</b><br>
      <i>Werte:</i> Sicherheit und Unabhängigkeit<br>
      <i>Norm:</i> Spitzenmodelle erst nach Prüfung durch unabhängige, internationale Prüfer veröffentlichen.<br>
      <i>Begründung:</i> KI wird extrem schnell besser, deshalb braucht es Kontrolle. Eine Bremse für alle würde aber den Vorsprung von USA und China festschreiben. Nur die Spitze zu kontrollieren schützt beide Werte.
    </div>

    <div class="quellen">
      <b>Quellen</b>
      <ol>
        <li>D. Amodei: „We Must Pace the Frontier“, 12.09.2026, darioamodei.com</li>

        <li>Reuters: „Europe's AI firms, playing catch-up, challenge US calls for slowdown“, 09/2026</li>
      </ol>
    </div>
